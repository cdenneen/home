name: Merge dependency PR

on:
  workflow_run:
    workflows: ["flake-ci"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-pr-merges
  cancel-in-progress: false

jobs:
  merge:
    # Only evaluate pull request-triggered CI runs
    if: >
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # No checkout in this job; gh needs an explicit repo context.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify required eval jobs passed
        id: evals
        run: |
          RUN_ID=$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")
          JOBS_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")

          NIXOS_RESULT=$(echo "$JOBS_JSON" | jq -r '.jobs[] | select(.name=="nixos-eval") | .conclusion' | head -n1)
          DARWIN_RESULT=$(echo "$JOBS_JSON" | jq -r '.jobs[] | select(.name=="darwin-eval") | .conclusion' | head -n1)

          echo "nixos=${NIXOS_RESULT:-missing}" >> "$GITHUB_OUTPUT"
          echo "darwin=${DARWIN_RESULT:-missing}" >> "$GITHUB_OUTPUT"

          if [ "${NIXOS_RESULT:-}" = "success" ] && [ "${DARWIN_RESULT:-}" = "success" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Required eval checks not successful; PR will remain open."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Locate flake.lock PR
        id: pr
        if: steps.evals.outputs.ready == 'true'
        run: |
          HEAD_REPO=$(jq -r '.workflow_run.head_repository.full_name // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$HEAD_REPO" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "Run head repository '$HEAD_REPO' does not match '$GITHUB_REPOSITORY'; skipping auto-merge."
            echo "pr=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD_BRANCH=$(jq -r '.workflow_run.head_branch // empty' "$GITHUB_EVENT_PATH")
          if [[ "$HEAD_BRANCH" != update-flake-* ]]; then
            echo "Run is for branch '$HEAD_BRANCH', not an automated flake-input branch; skipping auto-merge."
            echo "pr=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$PR" ]; then
            echo "pr=$PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$HEAD_BRANCH" ]; then
            PR=$(gh pr list \
              --base main \
              --head "$HEAD_BRANCH" \
              --state open \
              --json number \
              --jq '.[0]?.number // empty')
          else
            PR=""
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Merge or refresh dependency PR
        if: steps.evals.outputs.ready == 'true' && steps.pr.outputs.pr != ''
        run: |
          PR="${{ steps.pr.outputs.pr }}"
          run_head=$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")
          pr_head=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          if [ "$run_head" != "$pr_head" ]; then
            echo "CI run ${run_head} is stale for PR #${PR} at ${pr_head}; ignoring it."
            exit 0
          fi

          merge_state=$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus)
          case "$merge_state" in
            BEHIND)
              echo "PR #${PR} is behind main; rebasing it before another CI run."
              for attempt in 1 2 3; do
                if gh pr update-branch --rebase "$PR"; then
                  exit 0
                fi
                if [ "$attempt" -eq 3 ]; then
                  echo "Unable to rebase PR #${PR} after ${attempt} attempts." >&2
                  exit 1
                fi
                sleep $((attempt * 3))
              done
              ;;
            CLEAN)
              gh pr merge --squash --delete-branch "$PR"
              ;;
            *)
              echo "PR #${PR} is ${merge_state}; leaving it open without failing the workflow."
              exit 0
              ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
