name: flake-ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_checks:
        description: "Run full explicit host eval/build checks"
        required: false
        type: boolean
        default: false

concurrency:
  group: flake-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Flake checks are intentionally omitted in CI.
  # They are strict under flake-parts and require per-system guarantees
  # that are better validated via system evals below.

  nixos-eval:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Configure private flake access
        env:
          GITLAB_AXIS_READ_TOKEN: ${{ secrets.GITLAB_AXIS_READ_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GITLAB_AXIS_READ_TOKEN" ]; then
            echo "PRIVATE_FLAKE_AUTH_UNAVAILABLE: GITLAB_AXIS_READ_TOKEN is unavailable in this workflow context" >&2
            exit 1
          fi
          if [ -z "$GH_PAT" ]; then
            echo "PRIVATE_FLAKE_AUTH_UNAVAILABLE: GH_PAT is unavailable in this workflow context" >&2
            exit 1
          fi
          umask 077
          cat > "$HOME/.netrc" <<EOF
          machine gitlab.com
            login gitlab+deploy-token-15084811
            password $GITLAB_AXIS_READ_TOKEN
          EOF
          export NIX_CONFIG="access-tokens = github.com=$GH_PAT"
          {
            echo "NIX_CONFIG<<EOF"
            printf '%s\n' "$NIX_CONFIG"
            echo "EOF"
          } >> "$GITHUB_ENV"
          unset GITLAB_AXIS_READ_TOKEN
          git ls-remote https://gitlab.com/ghostspace/axis.git HEAD >/dev/null || {
            echo "PRIVATE_FLAKE_AUTH_UNAVAILABLE: cannot read ghostspace/axis" >&2
            exit 1
          }
          nix flake metadata github:ghostspace-com/axis-control/ba7e03ecce879be7047263b827d4a4dba8fd8527 --json >/dev/null || {
            echo "PRIVATE_FLAKE_AUTH_UNAVAILABLE: cannot read ghostspace-com/axis-control" >&2
            exit 1
          }
          unset GH_PAT
      - uses: cachix/cachix-action@v17
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: cdenneen
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Evaluate NixOS (nyx)
        run: nix eval --raw .#nixosConfigurations.nyx.config.system.build.toplevel.drvPath --accept-flake-config

  darwin-eval:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Configure private flake access
        env:
          GITLAB_AXIS_READ_TOKEN: ${{ secrets.GITLAB_AXIS_READ_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GITLAB_AXIS_READ_TOKEN" ]; then
            echo "PRIVATE_FLAKE_AUTH_UNAVAILABLE: GITLAB_AXIS_READ_TOKEN is unavailable in this workflow context" >&2
            exit 1
          fi
          if [ -z "$GH_PAT" ]; then
            echo "PRIVATE_FLAKE_AUTH_UNAVAILABLE: GH_PAT is unavailable in this workflow context" >&2
            exit 1
          fi
          umask 077
          cat > "$HOME/.netrc" <<EOF
          machine gitlab.com
            login gitlab+deploy-token-15084811
            password $GITLAB_AXIS_READ_TOKEN
          EOF
          export NIX_CONFIG="access-tokens = github.com=$GH_PAT"
          {
            echo "NIX_CONFIG<<EOF"
            printf '%s\n' "$NIX_CONFIG"
            echo "EOF"
          } >> "$GITHUB_ENV"
          unset GITLAB_AXIS_READ_TOKEN
          git ls-remote https://gitlab.com/ghostspace/axis.git HEAD >/dev/null || {
            echo "PRIVATE_FLAKE_AUTH_UNAVAILABLE: cannot read ghostspace/axis" >&2
            exit 1
          }
          nix flake metadata github:ghostspace-com/axis-control/ba7e03ecce879be7047263b827d4a4dba8fd8527 --json >/dev/null || {
            echo "PRIVATE_FLAKE_AUTH_UNAVAILABLE: cannot read ghostspace-com/axis-control" >&2
            exit 1
          }
          unset GH_PAT
      - uses: cachix/cachix-action@v17
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: cdenneen
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Evaluate Darwin (VNJTECMBCD)
        run: nix eval --raw .#darwinConfigurations.VNJTECMBCD.system.drvPath --accept-flake-config
      - name: Evaluate Darwin (mbair legacy stack)
        run: nix eval --raw .#darwinConfigurations.mbair.system.drvPath --accept-flake-config

  flake-checks-full-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.full_checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Full explicit checks (Linux)
        run: |
          nix flake check --accept-flake-config
          nix build .#nixosConfigurations.nyx.config.system.build.toplevel --accept-flake-config
          nix build .#nixosConfigurations.MacBook-Pro-NixOS.config.system.build.toplevel --accept-flake-config

  flake-checks-full-darwin:
    if: github.event_name == 'workflow_dispatch' && inputs.full_checks
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Full explicit checks (Darwin)
        run: |
          nix flake check --accept-flake-config
          nix build .#darwinConfigurations.VNJTECMBCD.system --accept-flake-config
          nix build '.#homeConfigurations.cdenneen@VNJTECMBCD.activationPackage' --accept-flake-config

  # Cachix publishing is handled in a separate workflow triggered only on push
