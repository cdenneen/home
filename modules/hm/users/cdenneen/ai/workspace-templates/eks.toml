approval_policy = "on-request"
sandbox_mode = "workspace-write"
default_permissions = "workspace-dev"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "detailed"

developer_instructions = """
Workspace focus: EKS and Kubernetes operations.

Routing guidance:
- Use `kubernetes-expert` first for cluster context, events, logs, rollout, and manifest issues.
- Use `flux-expert` for FluxCD/Flux Operator state, source drift, and reconciliation failures.
- Use `aws-expert` for EKS IAM/OIDC, node/IRSA auth, and AWS service integration failures.
- Use `terraform-expert` when the issue is rooted in IaC wiring or module outputs.
- Use `gitlab-ci-expert` for deployment pipeline blockers or environment promotion flow.

Execution guidance:
- Verify context/namespace from available state; ask only when multiple plausible targets make mutation unsafe.
- Use read-only diagnostics first, then apply requested local manifest/config fixes and validate them in the same run.
- Require target-specific confirmation before mutating a live cluster, triggering a rollout, or reconciling production resources.
- End with completed validation results; report a next action only for a genuine external blocker.
"""
